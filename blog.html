<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Blog | Armani West</title>
<link rel="icon" href="assets/img/avatar.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,wght@0,500;0,700;0,900;1,600;1,700&family=DM+Sans:wght@400;500;700&family=Unbounded:wght@600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/site.css">
</head>
<body>
<main class="wrap" id="root"></main>
<script type="module">
import { boot, store, auth, award, esc, md, $ } from './assets/js/core.js';
await boot('blog');
const slug = new URLSearchParams(location.search).get('p');
const posts = (await store.list('posts', { orderBy: 'ts' })).filter(p => p.published);
const root = $('#root');
if (slug) {
  const p = posts.find(x => x.slug === slug || x.id === slug);
  if (!p) root.innerHTML = '<h1 class="sec-t">Post <i>not found</i></h1><a class="btn" href="blog.html">Back to blog</a>';
  else {
    document.title = p.title + ' | Armani West';
    root.innerHTML = `<article class="prose"><a class="note" href="blog.html">&larr; All posts</a><p class="eyebrow" style="margin-top:20px">${new Date(p.ts).toLocaleDateString(undefined, { dateStyle: 'long' })}</p><h1 class="sec-t">${esc(p.title)}</h1>${p.cover ? `<img class="post-cover" src="${esc(p.cover)}" alt="">` : ''}${md(p.body)}</article>`;
    auth.onChange(u => { if (u) award('read-' + p.id, 2); });
  }
} else {
  root.innerHTML = `<p class="eyebrow">Notes from Armani</p><h1 class="sec-t">The <i>blog</i></h1><div class="grid g3">${posts.map(p => `<a class="card" href="blog.html?p=${encodeURIComponent(p.slug || p.id)}">${p.cover ? `<img class="post-cover" src="${esc(p.cover)}" alt="" style="margin-bottom:12px">` : ''}<p class="eyebrow">${new Date(p.ts).toLocaleDateString(undefined, { dateStyle: 'medium' })}</p><h3>${esc(p.title)}</h3><p class="meta">${esc(p.excerpt || '')}</p></a>`).join('') || '<p class="note">First post coming soon.</p>'}</div>`;
}
</script>
</body>
</html>
