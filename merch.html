<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Merch | Armani West</title>
<link rel="icon" href="assets/img/avatar.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,wght@0,500;0,700;0,900;1,600;1,700&family=DM+Sans:wght@400;500;700&family=Unbounded:wght@600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/site.css">
</head>
<body>
<main class="wrap">
  <p class="eyebrow">Official store</p>
  <h1 class="sec-t">The <i>merch</i></h1>
  <div class="grid g4" id="shop"></div>
  <p class="note" style="margin-top:24px">Checkout opens on a secure store page (Shopify, Stripe link or similar) that Armani sets per item in her portal. This site never handles card details.</p>
</main>
<script type="module">
import { boot, store, esc, cfg, $ } from './assets/js/core.js';
await boot('merch');
const items = await store.list('merch');
$('#shop').innerHTML = items.map(m => {
  const link = m.link || cfg.shopUrl;
  return `<div class="card prod">${m.sample ? '<span class="badge">Sample</span>' : ''}<div class="pic">${m.image ? `<img src="${esc(m.image)}" alt="${esc(m.name)}">` : esc(m.emoji || '🛍️')}</div><h3>${esc(m.name)}</h3><p class="meta">${esc(m.blurb || '')}</p><span class="price">${esc(m.price)}</span>${link ? `<a class="btn sm primary" href="${esc(link)}" target="_blank" rel="noopener">Buy</a>` : '<button class="btn sm" disabled>Coming soon</button>'}</div>`;
}).join('') || '<p class="note">Drop coming soon.</p>';
</script>
</body>
</html>
