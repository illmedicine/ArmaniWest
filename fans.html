<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fanboys | Armani West</title>
<link rel="icon" href="favicon.ico?v=2" sizes="48x48"><link rel="icon" type="image/png" sizes="32x32" href="assets/img/shield-32.png"><link rel="icon" type="image/png" sizes="192x192" href="assets/img/shield-192.png"><link rel="apple-touch-icon" href="assets/img/shield-apple.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,wght@0,500;0,700;0,900;1,600;1,700&family=DM+Sans:wght@400;500;700&family=Unbounded:wght@600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<link rel="stylesheet" href="assets/site.css">
</head>
<body>
<main class="wrap">
  <p class="eyebrow">Members only perks</p>
  <h1 class="sec-t">The <i>Fanboys</i></h1>

  <div class="card rave" id="me" style="margin-bottom:30px"></div>

  <h2 class="sec-t" style="font-size:30px">Leaderboard</h2>
  <ol class="board" id="board" style="padding:0;margin:0 0 40px"></ol>

  <h2 class="sec-t" style="font-size:30px">Prestige <i>&amp; rewards</i></h2>
  <div class="tiers" id="tiers" style="margin-bottom:12px"></div>
  <p class="note" style="margin-bottom:40px">Earn points: join (+50), visit daily (+5), put yourself on the map (+20), read a blog post (+2).</p>

  <h2 class="sec-t" style="font-size:30px">Fan <i>map</i></h2>
  <div class="snapmap">
    <div id="map" tabindex="0" aria-label="Fan map"></div>
    <div class="sm-top"><input class="sm-q" type="search" placeholder="Find a Maniac" aria-label="Find a fan"><span class="sm-count"></span><button class="sm-home" aria-label="Reset view" title="Reset view">&#8962;</button></div>
    <div class="sm-sheet" aria-live="polite"></div>
    <div class="sm-tray"></div>
  </div>
  <p class="note" style="margin-top:10px">Pins are city or state level only and appear only for members who opt in.</p>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script type="module">
import { mountFanMap } from './assets/js/fanmap.js';
import { FOUNDERS } from './assets/js/seed.js';
import { boot, store, auth, demo, loadMember, award, getGeo, consent, tierFor, nextTier, TIERS, esc, toast, $ } from './assets/js/core.js';
await boot('fans');

async function drawPins() {
  const live = await store.list('pins'), pts = {}; (await store.list('board')).forEach(x => pts[x.handle] = x.points);
  const pins = [...FOUNDERS.map(f => ({ id: 'f-' + f.handle, handle: f.handle, city: f.city, lat: f.lat, lng: f.lng, points: f.points, look: f.look })), ...live.filter(p => !FOUNDERS.some(f => f.handle === p.handle)).map(p => ({ ...p, points: pts[p.handle] || 0 }))];
  mountFanMap({ el: $('#map'), pins, tierFor });
}
async function drawBoard() {
  const b = [...FOUNDERS, ...(await store.list('board', { orderBy: 'points', limit: 25 })).filter(x => !FOUNDERS.some(f => f.handle === x.handle))].sort((x, y) => y.points - x.points).slice(0, 25);
  $('#board').innerHTML = b.map(x => `<li><span><b>${esc(x.handle)}</b></span><span class="tier">${tierFor(x.points).icon} ${tierFor(x.points).name}</span><span class="pts">${x.points} pts</span></li>`).join('');
}
$('#tiers').innerHTML = TIERS.map(t => `<div class="card"><div class="ic">${t.icon}</div><h3>${t.name}</h3><p class="meta">${t.min}+ pts</p><p class="note">${esc(t.reward)}</p></div>`).join('');

async function drawMe() {
  const box = $('#me');
  if (!auth.user) { box.innerHTML = `<h2 class="disp" style="font-size:28px">Become a Maniac</h2><p class="note">Sign in with Google to earn prestige points, join the leaderboard and unlock Armani's members-only text line.</p><button class="btn primary" id="join">Continue with Google</button>`; if (demo) { box.hidden = true; return; } if (!demo) $('#join').onclick = async () => { await auth.signIn(); }; return; }
  const m = await loadMember(), t = tierFor(m.points), n = nextTier(m.points);
  const contact = await store.get('private', 'contact').catch(() => null);
  const pct = n ? Math.round((m.points - t.min) / (n.min - t.min) * 100) : 100;
  box.innerHTML = `<div class="grid g2"><div><p class="eyebrow">${t.icon} ${t.name}</p><h2 class="disp" style="font-size:34px">${esc(m.handle)}</h2><p class="stat">${m.points}<small style="font-size:14px;color:var(--mute)"> pts</small></p><div class="bar"><i style="width:${pct}%"></i></div><p class="note">${n ? `${n.min - m.points} pts to ${n.name}` : 'Top tier reached.'}</p>
    <label for="hdl">Public display name</label><div class="row"><input id="hdl" value="${esc(m.handle)}" maxlength="24"><button class="btn sm" id="savehdl">Save</button></div>
    <label><input type="checkbox" id="onboard" style="width:auto" ${m.showOnBoard ? 'checked' : ''}> Show me on the leaderboard</label>
    <label><input type="checkbox" id="onmap" style="width:auto" ${m.mapOptIn ? 'checked' : ''}> Put my city on the fan map</label></div>
    <div><p class="eyebrow">Members line</p><h3 class="disp" style="font-size:22px">Text Armani</h3>${contact?.phone ? `<p class="note">Members only. Please keep it respectful and do not share this number.</p><a class="btn primary" href="sms:${esc(contact.phone.replace(/[^\d+]/g, ''))}">Text: ${esc(contact.phone)}</a>` : '<p class="note">The line unlocks when Armani adds it.</p>'}</div></div>`;
  $('#savehdl').onclick = async () => { const h = $('#hdl').value.trim().slice(0, 24); if (!h) return; await store.set('members', auth.user.uid, { handle: h }); if (m.showOnBoard) await store.set('board', auth.user.uid, { handle: h }); toast('Saved'); drawBoard(); };
  $('#onboard').onchange = async e => { await store.set('members', auth.user.uid, { showOnBoard: e.target.checked }); if (e.target.checked) await store.set('board', auth.user.uid, { handle: m.handle, points: m.points }); else await store.remove('board', auth.user.uid); drawBoard(); };
  $('#onmap').onchange = async e => {
    if (!e.target.checked) { await store.set('members', auth.user.uid, { mapOptIn: false }); await store.remove('pins', auth.user.uid); toast('Removed from map'); return; }
    const g = await getGeo(); if (!g) { toast('Could not find your city'); e.target.checked = false; return; }
    await store.set('pins', auth.user.uid, { handle: m.handle, city: g.city, lat: g.lat, lng: g.lng });
    await store.set('members', auth.user.uid, { mapOptIn: true }); await award('map', 20); toast('You are on the map'); location.reload();
  };
}
await Promise.all([drawBoard(), drawPins()]);
auth.onChange(drawMe);
</script>
</body>
</html>
