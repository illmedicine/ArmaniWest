<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>About | Armani West</title>
<meta name="description" content="The story of Armani West: upbringing, modeling, acting and music.">
<link rel="icon" type="image/png" href="assets/img/logo-w-sm.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,wght@0,500;0,700;0,900;1,600;1,700&family=DM+Sans:wght@400;500;700&family=Unbounded:wght@600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/site.css">
</head>
<body data-noavatar>
<main>
  <section class="paper">
    <div class="wrap" style="padding-bottom:30px">
      <div class="mast"><h2>Armani<br>West</h2><small>The Maniacs Issue<br>Los Angeles<br>No. 01</small></div>
      <div class="grid" style="grid-template-columns:1.1fr 1fr;gap:40px;align-items:center" id="aboutTop">
        <div>
          <p class="eyebrow">Cover story</p>
          <div class="pull" id="pull"></div>
          <span class="sticker">Rapper</span><span class="sticker t">Model</span><span class="sticker u">Actor</span><span class="sticker">Creator</span>
          <div class="cols" style="margin-top:18px" id="intro"></div>
        </div>
        <div style="position:relative">
          <img src="assets/img/snap/snap-a.jpg" alt="Armani West in a locker room with a basketball" style="width:100%;border-radius:4px;display:block">
          <div class="av-hero" id="heroAv" style="position:absolute;right:-6%;bottom:-8%;--av-size:38%;"></div>
        </div>
      </div>
    </div>
  </section>

  <section class="rave"><div class="wrap">
    <p class="eyebrow">The long read</p>
    <h2 class="sec-t">Her <i>story</i></h2>
    <div id="chapters"></div>
  </div></section>

  <section class="wrap" style="text-align:center">
    <h2 class="sec-t">Be a <i>Maniac</i></h2>
    <div class="cta center"><a class="btn primary" href="fans.html">Join the Maniacs</a><a class="btn" href="music.html">Hear the music</a><a class="btn" href="cameo.html">Request a Cameo</a></div>
  </section>
</main>
<script type="module">
import { boot, store, esc, md, $ } from './assets/js/core.js';
import { mountAvatar } from './assets/js/avatar.js';
await boot('about');
const av = mountAvatar($('#heroAv'));
let t = 0; setInterval(() => av.random(['hipSway', 'wave', 'bounce', 'shimmy', 'headbop'], { dir: (t++ % 2) ? 1 : -1 }), 3200);
const DEF = {
  pull: `Teal hair. Fur ears. A basketball under one arm.`,
  intro: `Armani West is a Los Angeles rapper, actor and creator who calls herself the princess of rap. She built her following freestyling live online, then turned it into mixtapes, a global streaming hit and a fan army called the Maniacs.

Her single "basketball" has its own music video, and her debut studio album, "She's The MAN", is on the way.`,
  upbringing: `Armani grew up in a small town in Ohio. She took her first hip hop classes at nine, wrote fan fiction at ten and filled summer camp notebooks with poems. Being turned away from big-name auditions never slowed her down. She decided early that she would follow her dreams and that Los Angeles was where she would do it.

She moved to Hollywood for an arts college at eighteen and lived what she calls her Victorious dream: classes, friends and a city full of possibility.`,
  acting: `Acting came first. Armani studied it every day in Hollywood and was working toward a degree in it when rap took over. She says she did not give music her full attention at first, and that the stage and the camera now feed each other.`,
  music: `It started with freestyles on live. Real fans showed up, then label CEOs and A&Rs, and she left school to go all in: months of recording until 6 a.m., releasing, promoting and selling her own music. She dropped her hit mixtape, followed it with more projects, and watched her breakout record climb worldwide playlists to millions of streams.

Now living in Los Angeles full time, she is preparing her debut studio album, "She's The MAN". Catch "basketball", "Piano Tiles", "maneater" and "A.i" on streaming and YouTube.`,
};
const stored = (await store.get('site', 'about')) || {};
const a = { ...DEF, ...Object.fromEntries(Object.entries(stored).filter(([, v]) => v)) };
$('#pull').innerHTML = `<b>${esc(a.pull)}</b>`;
$('#intro').innerHTML = md(a.intro);
const ch = [
  ['01', 'Upbringing', a.upbringing],
  ['02', 'Modeling', a.modeling],
  ['03', 'Acting', a.acting],
  ['04', 'Recording artist', a.music],
];
$('#chapters').innerHTML = ch.filter(c => c[2]).map(([n, t, body, hint]) => `<div class="chap"><div class="no">${n}</div><div><h3>${t}</h3>${body ? `<div class="prose" style="margin:0">${md(body)}</div>` : ''}</div></div>`).join('');
</script>
</body>
</html>
